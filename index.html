<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu regalo especial</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #ff4500, #000);
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
    }
    .carrito {
      width: 300px;
      margin-top: 30px;
      animation: zoom 3s infinite alternate;
    }
    @keyframes zoom {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <h1>🚗 Feliz Día del Carrito Hot Wheels 🚗</h1>
  <p>Este detalle es para ti, porque eres alguien muy especial 💖</p>
  <img src="carrito.png" alt="Carrito Hot Wheels" class="carrito">
</body>
</html>
